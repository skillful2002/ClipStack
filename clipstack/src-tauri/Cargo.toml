[package]
name = "clipstack"
version = "0.2.4"
description = "ClipStack 跨平台剪切板管理器"
authors = ["ClipStack"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "clipstack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"            # 跨平台剪贴板读写（P1 捕获引擎：get_text/get_image/get_file）
rusqlite = { version = "0.32", features = ["bundled"] }  # SQLite 持久化（P2）
aes-gcm = "0.10"         # P0 内容加密 AES-256-GCM
argon2 = "0.5"           # P0 主密码 → 密钥派生 / 校验
zeroize = { version = "1", features = ["derive"] }  # P0 密钥内存清零
base64 = "0.22"          # P0 content_text 密文 base64 存储
rand = "0.8"             # P0 加密随机 nonce
png = "0.17"                        # 图片预览：把 arboard 原始 RGBA 像素编码为 PNG 存储（P8）
image = "0.25"                       # 把截图软件写入的 BMP/CF_BITMAP/CF_DIB 解码为 RGBA（Windows 图片捕获补全）
clipboard-win = "5"                  # 直接读 arboard 3.x 未覆盖的 CF_BITMAP / CF_DIB 剪贴板图片格式（Windows）
tauri-plugin-global-shortcut = "2"  # P4 全局快捷键（唤起主界面）
tauri-plugin-autostart = "2"        # P6 开机自启开关
tauri-plugin-dialog = "2"           # 另存为：系统文件 / 目录选择对话框
tauri-plugin-opener = "2"           # 打开系统默认浏览器（关于页「打开下载页」）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }  # 后台静默检查 Gitee 新版本
trash = "5"                        # 跨平台移动文件/目录到系统回收站（清空共享文件夹时使用）

# ===== 局域网共享（L2/L3，见 clipstack-lan-sync-design.md）=====
clipstack-protocol = { path = "../../clipstack-protocol" }  # 共享协议库
mdns-sd = "0.20"                  # 纯 Rust mDNS 发现（不依赖系统 Bonjour/Avahi）
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tokio-tungstenite = "0.29"        # WebSocket（mesh 直连传输）
futures-util = "0.3"              # WS 流处理
pbkdf2 = "0.12"                   # PSK 派生
hmac = "0.12"                     # PBKDF2 的 HMAC 后端
sha2 = "0.10"                     # SHA256（指纹 / salt）
uuid = { version = "1", features = ["v4"] }  # 设备 id / sync_id 生成

# macOS 专用：读取 NSPasteboard.changeCount 做变更检测，读取来源应用名（NSWorkspace.frontmostApplication）
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSWorkspace", "NSRunningApplication"] }
security-framework = "2"          # 内部数据库加密密钥的钥匙串持久化（clipstack.enc，无生物识别保护）
security-framework-sys = "2"      # 提供 kSec* 常量与 SecItemAdd 等底层符号（与 security-framework 同主版本）
core-foundation = "0.9"           # security-framework 的 CF 对象类型（CFDictionary/CFData/CFString 等）
