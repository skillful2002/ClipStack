[package]
name = "clipstack"
version = "0.0.0"
description = "ClipStack 跨平台剪切板管理器"
authors = ["ClipStack"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "clipstack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"            # 跨平台剪贴板读写（P1 捕获引擎：get_text/get_image/get_file）
rusqlite = { version = "0.32", features = ["bundled"] }  # SQLite 持久化（P2）
png = "0.17"                        # 图片预览：把 arboard 原始 RGBA 像素编码为 PNG 存储（P8）
image = "0.25"                       # 把截图软件写入的 BMP/CF_BITMAP/CF_DIB 解码为 RGBA（Windows 图片捕获补全）
clipboard-win = "5"                  # 直接读 arboard 3.x 未覆盖的 CF_BITMAP / CF_DIB 剪贴板图片格式（Windows）
tauri-plugin-global-shortcut = "2"  # P4 全局快捷键（唤起主界面）
tauri-plugin-autostart = "2"        # P6 开机自启开关

# macOS 专用：读取 NSPasteboard.changeCount 做变更检测，读取来源应用名（NSWorkspace.frontmostApplication）
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
